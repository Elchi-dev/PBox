[package]
name = "pbox-loader"
description = "Maps PE32+ images into memory, relocates them, binds imports to host functions and runs their code natively."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
pbox-pe.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_Memory", "Win32_System_SystemInformation"] }

[lints]
workspace = true
